<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="The same package panel numbered for reading order at two metres and again at arm's length, with the orders differing">
  <title>Hierarchy at two distances — the order changes</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#565c66">SAME PANEL · TWO DISTANCES · DIFFERENT ORDER</text>

  <!-- at 2m -->
  <text x="235" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#2f4f6b">AT TWO METRES</text>
  <rect x="150" y="96" width="170" height="210" fill="#ffffff" stroke="#171a22" stroke-width="2"/>
  <rect x="150" y="96" width="170" height="86" fill="#2f4f6b"/>
  <rect x="172" y="200" width="126" height="18" fill="#171a22"/>
  <rect x="172" y="230" width="84" height="10" fill="#c3c9c2"/>
  <rect x="172" y="250" width="126" height="6" fill="#e3e6e0"/>
  <rect x="172" y="262" width="126" height="6" fill="#e3e6e0"/>
  <rect x="172" y="274" width="96" height="6" fill="#e3e6e0"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#8a3d2f">
    <text x="333" y="146">1</text><text x="333" y="215">2</text><text x="333" y="240">3</text>
  </g>
  <text x="235" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#8b9199">colour mass → name → variant</text>

  <!-- at arm's length -->
  <text x="665" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#2f4f6b">AT ARM’S LENGTH</text>
  <rect x="580" y="96" width="170" height="210" fill="#ffffff" stroke="#171a22" stroke-width="2"/>
  <rect x="580" y="96" width="170" height="86" fill="#2f4f6b"/>
  <rect x="602" y="200" width="126" height="18" fill="#171a22"/>
  <rect x="602" y="230" width="84" height="10" fill="#c3c9c2"/>
  <rect x="602" y="250" width="126" height="6" fill="#e3e6e0"/>
  <rect x="602" y="262" width="126" height="6" fill="#e3e6e0"/>
  <rect x="602" y="274" width="96" height="6" fill="#e3e6e0"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#8a3d2f">
    <text x="763" y="215">1</text><text x="763" y="240">2</text><text x="763" y="258">3</text><text x="763" y="146">4</text>
  </g>
  <text x="665" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#8b9199">name → variant → claim → colour</text>

  <line x1="60" y1="352" x2="840" y2="352" stroke="#e3e6e0" stroke-width="1"/>
  <text x="450" y="374" text-anchor="middle" font-family="Charter, Georgia, serif" font-size="16" fill="#171a22">If both orders are not deliberate, one of them is an accident.</text>
</svg>
