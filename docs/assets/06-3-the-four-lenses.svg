<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Four lenses named with the fault each one finds that the others cannot, and a note that each must find something distinct">
  <title>The four lenses — each finds what the others cannot</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#565c66">FOUR LENSES · EACH FINDS SOMETHING THE OTHERS DID NOT</text>

  <g>
    <rect x="60" y="70" width="185" height="200" fill="#f7f8f6" stroke="#c3c9c2" stroke-width="1.5"/>
    <rect x="60" y="70" width="185" height="6" fill="#2f4f6b"/>
    <text x="152" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#2f4f6b">ACCESSIBILITY</text>
    <text x="152" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#8b9199">do it first</text>
    <text x="76" y="168" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">Dosage 6 pt,</text>
    <text x="76" y="188" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">reversed out of</text>
    <text x="76" y="208" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">a mid-tone.</text>
    <text x="76" y="238" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">Nothing else finds</text>
    <text x="76" y="256" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">this.</text>
  </g>
  <g>
    <rect x="265" y="70" width="185" height="200" fill="#f7f8f6" stroke="#c3c9c2" stroke-width="1.5"/>
    <rect x="265" y="70" width="185" height="6" fill="#2f4f6b"/>
    <text x="357" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#2f4f6b">ETHICS</text>
    <text x="281" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">“Recycled content”</text>
    <text x="281" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">with no percentage,</text>
    <text x="281" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">on laminated board.</text>
    <text x="281" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">The claim goes or</text>
    <text x="281" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">the lamination does.</text>
  </g>
  <g>
    <rect x="470" y="70" width="185" height="200" fill="#f7f8f6" stroke="#c3c9c2" stroke-width="1.5"/>
    <rect x="470" y="70" width="185" height="6" fill="#2f4f6b"/>
    <text x="562" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#2f4f6b">VISUAL COMMS</text>
    <text x="486" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">First read is the</text>
    <text x="486" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">variant, not the</text>
    <text x="486" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">product name.</text>
    <text x="486" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">The order is not</text>
    <text x="486" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">the intended one.</text>
  </g>
  <g>
    <rect x="675" y="70" width="185" height="200" fill="#f7f8f6" stroke="#c3c9c2" stroke-width="1.5"/>
    <rect x="675" y="70" width="185" height="6" fill="#2f4f6b"/>
    <text x="767" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#2f4f6b">MARKET</text>
    <text x="691" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">Priced as premium,</text>
    <text x="691" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">shelved beside</text>
    <text x="691" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#171a22">own-brand.</text>
    <text x="691" y="212" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">Right object,</text>
    <text x="691" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#8b9199">wrong shelf.</text>
  </g>

  <rect x="60" y="296" width="800" height="46" fill="#fbf3f1" stroke="#d8b9b2" stroke-width="1.5"/>
  <text x="460" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#171a22">Every fault named carries what would have to change. A fault without a consequence is a description.</text>

  <line x1="60" y1="364" x2="840" y2="364" stroke="#e3e6e0" stroke-width="1"/>
  <text x="450" y="388" text-anchor="middle" font-family="Charter, Georgia, serif" font-size="16" fill="#171a22">A critique strong on one lens and silent on another has covered a quarter of the job.</text>
</svg>
