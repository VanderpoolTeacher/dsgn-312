<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Eight project phases mapped to seven scored components, with each component showing which learning outcome it evidences">
  <title>Eight phases, seven components — what each one evidences</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#565c66">A PHASE IS WHAT YOU DO · A COMPONENT IS WHAT IS MARKED</text>

  <text x="120" y="72" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#8b9199">PHASE</text>
  <text x="420" y="72" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#8b9199">COMPONENT</text>
  <text x="700" y="72" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#8b9199">EVIDENCES</text>
  <text x="810" y="72" font-family="ui-monospace, Menlo, monospace" font-size="11.5" letter-spacing="1.1" fill="#8b9199">WEIGHT</text>

  <g font-family="system-ui, sans-serif" font-size="13.5" fill="#171a22">
    <text x="120" y="106">1 · Pick the thing</text>
    <text x="420" y="106">A — Brand and product brief</text>
    <text x="700" y="106" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8b9199">container</text>
    <text x="810" y="106" font-family="ui-monospace, Menlo, monospace" font-size="12">10%</text>

    <text x="120" y="146">2 · Decide the material</text>
    <text x="420" y="146">B — Materials and structure spec</text>
    <text x="700" y="146" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f4f6b">LO 3</text>
    <text x="810" y="146" font-family="ui-monospace, Menlo, monospace" font-size="12">15%</text>

    <text x="120" y="186">3 · Explore, with AI</text>
    <text x="420" y="186">F — AI concept log</text>
    <text x="700" y="186" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f4f6b">LO 6</text>
    <text x="810" y="186" font-family="ui-monospace, Menlo, monospace" font-size="12">10%</text>

    <text x="120" y="226">4 · Draw it</text>
    <text x="120" y="248">5 · Build it</text>
    <text x="420" y="237">C — Prototype set</text>
    <text x="700" y="237" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f4f6b">LO 2</text>
    <text x="810" y="237" font-family="ui-monospace, Menlo, monospace" font-size="12">20%</text>

    <text x="120" y="288">6 · Critique another’s</text>
    <text x="420" y="288">E — Critique performance</text>
    <text x="700" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8a3d2f">LO 4</text>
    <text x="810" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12">10%</text>

    <text x="120" y="328">7 · Change it</text>
    <text x="420" y="328">D — The built system</text>
    <text x="700" y="328" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f4f6b">LO 1</text>
    <text x="810" y="328" font-family="ui-monospace, Menlo, monospace" font-size="12">20%</text>

    <text x="120" y="368">8 · Account for it</text>
    <text x="420" y="368">G — Case study + presentation</text>
    <text x="700" y="368" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2f4f6b">LO 5</text>
    <text x="810" y="368" font-family="ui-monospace, Menlo, monospace" font-size="12">15%</text>
  </g>

  <g stroke="#e3e6e0" stroke-width="1">
    <line x1="60" y1="86" x2="860" y2="86"/><line x1="60" y1="126" x2="860" y2="126"/>
    <line x1="60" y1="166" x2="860" y2="166"/><line x1="60" y1="206" x2="860" y2="206"/>
    <line x1="60" y1="266" x2="860" y2="266"/><line x1="60" y1="308" x2="860" y2="308"/>
    <line x1="60" y1="348" x2="860" y2="348"/>
  </g>
  <line x1="60" y1="386" x2="860" y2="386" stroke="#c3c9c2" stroke-width="1.5"/>
  <text x="450" y="410" text-anchor="middle" font-family="Charter, Georgia, serif" font-size="15.5" fill="#171a22">Outcome-carrying components hold 90%. A polished brief with thin artifacts fails, and the arithmetic says so.</text>
</svg>
